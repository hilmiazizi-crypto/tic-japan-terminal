<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIC JAPAN TERMINAL</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{--bg:#07080a;--panel:#0e1014;--line:#23262d;--amber:#ffb000;--red:#e8304a;--up:#22c55e;--dn:#ef4444;--txt:#d8d8d8;--mut:#7b808a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.4 "JetBrains Mono",Consolas,monospace}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:2px solid var(--red);background:#0b0c0f}
.logo{display:flex;align-items:center;gap:10px}.sun{width:26px;height:26px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.logo b{color:var(--amber);font-size:18px;letter-spacing:2px}.logo small{color:var(--red);font-size:11px;letter-spacing:3px}
.jp{color:var(--mut);font-size:12px}.clocks{margin-left:auto;display:flex;gap:16px;color:var(--mut)}.clocks span b{color:var(--amber)}
#ticker{white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--line);padding:4px 0;color:var(--mut)}#ticker #tk{display:inline-block;animation:sc 90s linear infinite}#ticker:hover #tk{animation-play-state:paused}.ti{cursor:pointer;padding:0 4px}.ti:hover{background:#181b21}.ti b{color:var(--amber)}.ti .tn{color:var(--mut)}#chart>div{height:100%}@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{display:grid;grid-template-columns:300px 1fr 330px;gap:8px;padding:8px;height:calc(100vh - 82px)}
.p{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.p h3{margin:0;padding:6px 10px;font-size:12px;color:#000;background:var(--amber);letter-spacing:1px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:#181b21}.row .s{color:var(--amber)}.row .n{color:var(--mut);font-size:11px}
.up{color:var(--up)}.dn{color:var(--dn)}.scroll{overflow:auto;flex:1}
.center{display:grid;grid-template-rows:1fr 190px;gap:8px;min-height:0}#chart{flex:1;min-height:0;position:relative}
.btns button{background:none;border:1px solid #000;color:#000;font:inherit;font-size:11px;cursor:pointer;padding:0 6px}.btns button.on{background:#000;color:var(--amber)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{background:var(--panel);border:1px solid var(--line);padding:8px;cursor:pointer}.mini .s{color:var(--amber)}.mini .v{font-size:20px}.mini canvas{width:100%;height:60px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px}.tabs button{background:#15181e;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:11px;padding:2px 8px;cursor:pointer}.tabs button.on{border-color:var(--amber);color:var(--amber)}
.news{padding:7px 10px;border-bottom:1px solid var(--line)}.news a{color:var(--txt);text-decoration:none}.news a:hover{color:var(--amber)}.news .m{font-size:10px;color:var(--mut)}.news .c{color:var(--red)}
#hdr{padding:6px 10px;display:flex;gap:16px;align-items:baseline}#hdr .big{font-size:24px;color:var(--amber)}
@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}.center{grid-template-rows:420px auto}.minis{grid-template-columns:repeat(2,1fr)}.p{max-height:500px}}
</style></head><body>
<header><div class="logo"><div class="sun"></div><div><b>TIC JAPAN TERMINAL</b><br><small>ティック・ジャパン ・ MARKETS</small></div></div><span class="jp" id="status">● LIVE</span>
<div class="clocks"><span>TOKYO <b id="jst"></b></span><span>JAKARTA <b id="wib"></b></span><span>NEW YORK <b id="ny"></b></span></div></header>
<div id="ticker"><div id="tk">Loading…</div></div>
<main>
<section class="p"><h3>ACTIVES / ウォッチリスト</h3><div class="scroll" id="watch"></div></section>
<section class="center"><div class="p"><h3><span id="ctitle">XAUUSD · GOLD</span><span class="btns" id="ranges"></span></h3><div id="hdr"></div><div id="chart"></div></div>
<div class="minis" id="minis"></div></section>
<section class="p"><h3>NEWS / ニュース <span id="nupd"></span></h3><div class="tabs" id="tabs"></div><div class="scroll" id="news"></div></section>
</main>
<script>
const WATCH=[['NVDA','NVIDIA'],['TSLA','Tesla'],['9984.T','SoftBank Group'],['BBRI.JK','Bank Rakyat Indonesia'],['AAPL','Apple'],['META','Meta'],['^N225','Nikkei 225'],['^JKSE','IHSG / JCI'],['7203.T','Toyota'],['BTC-USD','Bitcoin']];
const MINI=[['SI=F','XAGUSD · Silver'],['RATIO','XAU/XAG Ratio'],['JPY=X','USDJPY'],['^TNX','US10Y Yield']];
const NAMES={'GC=F':'XAUUSD · GOLD','SI=F':'XAGUSD · SILVER','JPY=X':'USDJPY','^TNX':'US 10Y YIELD'};WATCH.forEach(([s,n])=>NAMES[s]=s+' · '+n);
const RANGES={'1D':['1d','5m'],'5D':['5d','30m'],'1M':['1mo','1d'],'6M':['6mo','1d'],'1Y':['1y','1d'],'5Y':['5y','1wk']};
let cur='GC=F',rng='1D',q={};
const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const chg=(p,pv)=>{const c=p-pv,pc=c/pv*100;return `<span class="${c>=0?'up':'dn'}">${c>=0?'+':''}${fmt(c)} (${c>=0?'+':''}${fmt(pc)}%)</span>`};
function clocks(){const f=tz=>new Date().toLocaleTimeString('en-GB',{timeZone:tz});jst.textContent=f('Asia/Tokyo')+' JST';wib.textContent=f('Asia/Jakarta')+' WIB';ny.textContent=f('America/New_York')}setInterval(clocks,1000);clocks();
const TV={'GC=F':'OANDA:XAUUSD','SI=F':'OANDA:XAGUSD','JPY=X':'OANDA:USDJPY','IDR=X':'OANDA:USDIDR','^N225':'OANDA:JP225USD','NVDA':'NASDAQ:NVDA','TSLA':'NASDAQ:TSLA','AAPL':'NASDAQ:AAPL','META':'NASDAQ:META','BTC-USD':'BITSTAMP:BTCUSD'};
const YRANGE={'1D':['1d','5m'],'5D':['5d','30m'],'1M':['1mo','1h'],'6M':['6mo','1d'],'1Y':['1y','1d'],'5Y':['5y','1wk']};
let lwc=null;
async function yahooChart(el){el.innerHTML='';const c=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:'#0e1014'},textColor:'#9aa'},grid:{vertLines:{color:'#1a1d23'},horzLines:{color:'#1a1d23'}},timeScale:{timeVisible:true,borderColor:'#333'},rightPriceScale:{borderColor:'#333'},localization:{timeFormatter:t=>new Date(t*1000).toLocaleString('en-GB',{timeZone:'Asia/Tokyo',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})}});lwc=c;const cs=c.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});const [r,i]=YRANGE[rng];try{const d=await (await fetch(`/api/chart?s=${encodeURIComponent(cur)}&range=${r}&interval=${i}`)).json();cs.setData(d.candles);c.timeScale().fitContent();const m=d.meta,prev=rng==='1D'?m.prev:d.candles[0].open;hdr.innerHTML=`<span class="big">${fmt(m.price)}</span>${chg(m.price,prev)}<span class="jp">${m.currency||''} · Source: Yahoo Finance (${cur}) · upd ${new Date(m.time*1000).toLocaleTimeString('en-GB',{timeZone:'Asia/Tokyo'})} JST</span>`}catch(e){hdr.textContent='Data error'}}
NAMES['GC=F']='XAUUSD · GOLD (OANDA)';
const TVR={'1D':['1D','5'],'5D':['5D','30'],'1M':['1M','60'],'6M':['6M','D'],'1Y':['12M','D'],'5Y':['60M','W']};
function tvEmbed(el,kind,cfg){el.innerHTML='<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';const sc=document.createElement('script');sc.src='https://s3.tradingview.com/external-embedding/embed-widget-'+kind+'.js';sc.async=true;sc.innerHTML=JSON.stringify(cfg);el.firstChild.appendChild(sc)}
document.getElementById('ranges').innerHTML=Object.keys(RANGES).map(r=>`<button data-r="${r}">${r}</button>`).join('');
ranges.onclick=e=>{if(e.target.dataset.r){rng=e.target.dataset.r;loadChart()}};
function loadChart(){[...ranges.children].forEach(b=>b.classList.toggle('on',b.dataset.r===rng));ctitle.textContent=NAMES[cur]||cur;if(lwc){lwc.remove();lwc=null}if(!TV[cur])return yahooChart(document.getElementById('chart'));const sym=TV[cur],[r,i]=TVR[rng];
 hdr.innerHTML=`<span class="jp">Source: <b style="color:#ffb000">${sym}</b> via TradingView · waktu JST</span>`;
 tvEmbed(document.getElementById('chart'),'advanced-chart',{autosize:true,symbol:sym,interval:i,range:r,timezone:'Asia/Tokyo',theme:'dark',style:'1',locale:'en',backgroundColor:'#0e1014',gridColor:'rgba(40,44,52,0.6)',hide_side_toolbar:false,allow_symbol_change:false,withdateranges:true,details:false,calendar:false,support_host:'https://www.tradingview.com'})}
function select(s){cur=s;loadChart()}
const TAPE=[['GC=F','GOLD'],['SI=F','SILVER'],['JPY=X','USDJPY'],['IDR=X','USDIDR'],['^TNX','US10Y'],['^N225','NIKKEI'],['^JKSE','IHSG'],['NVDA','NVDA'],['TSLA','TSLA'],['9984.T','SOFTBANK'],['7203.T','TOYOTA'],['BBRI.JK','BBRI'],['AAPL','AAPL'],['META','META'],['BTC-USD','BTC']];NAMES['IDR=X']='USDIDR';NAMES['^N225']='^N225 · Nikkei 225';
function spark(cv,arr,up){const c=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=120;c.clearRect(0,0,w,h);if(!arr||arr.length<2)return;const mn=Math.min(...arr),mx=Math.max(...arr);c.strokeStyle=up?'#22c55e':'#ef4444';c.lineWidth=3;c.beginPath();arr.forEach((v,i)=>{const x=i/(arr.length-1)*w,y=h-(v-mn)/(mx-mn||1)*(h-10)-5;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
async function loadQuotes(){const syms=[...new Set(['GC=F','SI=F','JPY=X','^TNX',...TAPE.map(t=>t[0]),...WATCH.map(w=>w[0])])];try{const d=await (await fetch('/api/quotes?s='+syms.map(encodeURIComponent).join(','))).json();d.forEach(x=>q[x.symbol]=x);status.innerHTML='<span class="up">● LIVE</span>';}catch(e){status.innerHTML='<span class="dn">● OFFLINE</span>';return}
 watch.innerHTML=WATCH.map(([s,n])=>{const x=q[s]||{};return `<div class="row" onclick="select('${s}')"><div><div class="s">${s}</div><div class="n">${n}</div></div><div style="text-align:right">${fmt(x.price)}<br><small>${x.price?chg(x.price,x.prev):''}</small></div></div>`}).join('');
 const g=q['GC=F'],si=q['SI=F'];if(!minis.dataset.init){minis.dataset.init=1;minis.innerHTML=MINI.map(([s,n],i)=>`<div class="mini" ${s!=='RATIO'?`onclick="select('${s}')"`:''}><div class="s">${n}</div><div class="v" id="mv${i}"></div><canvas id="mc${i}"></canvas></div>`).join('');const m0=document.getElementById('mv0').parentNode;m0.innerHTML='';m0.style.padding='0';m0.style.height='130px';tvEmbed(m0,'mini-symbol-overview',{symbol:'OANDA:XAGUSD',width:'100%',height:'100%',dateRange:'1D',colorTheme:'dark',isTransparent:true,locale:'en',chartOnly:false,trendLineColor:'#ffb000',underLineColor:'rgba(255,176,0,0.15)'});}
 MINI.forEach(([s],i)=>{if(s==='SI=F')return;let x=q[s];if(s==='RATIO'&&g&&si&&g.price){const n=Math.min(g.spark.length,si.spark.length);x={price:g.price/si.price,prev:g.prev/si.prev,spark:g.spark.slice(-n).map((v,k)=>v/si.spark.slice(-n)[k])}}if(!x||!x.price)return;document.getElementById('mv'+i).innerHTML=`${fmt(x.price,s==='JPY=X'||s==='^TNX'?3:2)} <small>${chg(x.price,x.prev)}</small>`;spark(document.getElementById('mc'+i),x.spark,x.price>=x.prev)});
 const t=TAPE.map(([s,n])=>{const x=q[s];if(!x||!x.price)return'';const d=s==='JPY=X'||s==='^TNX'?3:s==='IDR=X'?0:2;return `<span class="ti" onclick="select('${s}')"><b>${n}</b> ${fmt(x.price,d)} <small>${chg(x.price,x.prev)}</small></span>`}).join(' <span class="tn">│</span> ');tk.innerHTML=t+' <span class="tn">│</span> '+t;}
let news=[],cat='All';const CATS=['All','Macro','Gold','Equity','FX','Asia'];
tabs.innerHTML=CATS.map(c=>`<button data-c="${c}">${c}</button>`).join('');tabs.onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;renderNews()}};
function renderNews(){[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.c===cat));const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
 document.getElementById('news').innerHTML=news.filter(n=>cat==='All'||n.cat===cat).slice(0,60).map(n=>`<div class="news"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="m"><span class="c">${n.cat}</span> · ${n.date?new Date(n.date).toLocaleString('en-GB',{timeZone:'Asia/Tokyo',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' JST':''}</div></div>`).join('')||'<div class="news">Tidak ada berita</div>'}
async function loadNews(){try{news=await (await fetch('/api/news')).json();nupd.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Tokyo'})+' JST';renderNews()}catch(e){}}
loadChart();loadQuotes();loadNews();setInterval(loadQuotes,30000);setInterval(loadNews,180000);
</script></body></html>
